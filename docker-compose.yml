version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: qfx_user
      POSTGRES_PASSWORD: qfx_secure
      POSTGRES_DB: qfx_db
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./apps/api
    ports: ["3001:3001"]
    depends_on: [postgres, redis]
    environment:
      DATABASE_URL: postgresql://qfx_user:qfx_secure@postgres:5432/qfx_db

  client:
    image: nginx:alpine
    ports: ["3000:80"]
    volumes: [./static-client:/usr/share/nginx/html]

  admin:
    image: nginx:alpine
    ports: ["3002:80"]
    volumes: [./static-admin:/usr/share/nginx/html]

volumes:
  postgres_data:
